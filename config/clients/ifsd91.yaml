  # before this config was written. The pipeline's Slack app/bot (see
  # docs/SETUP.md) must be invited separately from the interactive
  # claude.ai connector Chad uses day-to-day.
  muckrack_slack_channel: "#ifsd91-firehose"
  slack_channel_id: "C0BFDPWBUTE"

  tveyes_saved_search: "needs creating in TVEyes"

  # Boolean queries for reference only — Chad creates these as actual Google
  # Alerts with RSS delivery, then the resulting feed URLs go under
  # google_alert_feeds below.
