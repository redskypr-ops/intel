    - '"Karla LaOrange"'
    - '"Idaho Falls School District 91" OR "District 91" superintendent'
    - '"Idaho Falls Education Association" negotiations OR mediation'
    - '"Hillary Radcliffe" Idaho Falls'
  google_alert_feeds: []

  reddit_keywords:
    - "Karla LaOrange"
    - "Idaho Falls School District"
    - "District 91"

  social_handles:
    - "Change.org petition tracker"
    - "X keyword search"

