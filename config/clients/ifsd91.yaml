# Idaho Falls School District 91 — first proof-of-concept client for the
# Red Sky Intelligence Pipeline. Real-time alerting (not digest-only): the
# June 2026 no-confidence petition against Superintendent Karla LaOrange is
# an actively unfolding situation.
#
# notion_client_page_id is intentionally left blank: IFSD91 does not yet
# exist as a row in the Notion Clients DB (checked 2026-07-06). Add it there
# and paste the page ID below before this client's Signals can be linked via
# the Client(s) relation — see docs/SETUP.md. The pipeline still runs and
# writes Signals without it; only the relation is skipped.

client: "Idaho Falls School District 91"
notion_client_page_id: null

contacts:
  - "Karla LaOrange"
  - "Hillary Radcliffe"
  - "Idaho Falls School District 91"
  - "District 91"
  - "IFSD91"

sources:
